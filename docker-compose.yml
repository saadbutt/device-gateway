services:
  gateway:
    build: .
    command: ["-addr", ":5027", "-metrics-addr", ":9100", "-log-level", "info"]
    ports:
      - "5027:5027"
      - "9100:9100"
    healthcheck:
      # scratch has no shell and no curl, so the gateway is probed from the
      # simulator's dependency ordering instead of an in-container check.
      disable: true

  simulator:
    build: .
    entrypoint: ["/simulator"]
    command: ["-addr", "gateway:5027", "-devices", "200", "-batch", "10", "-drop-rate", "0.15", "-storm", "30s"]
    depends_on:
      - gateway
